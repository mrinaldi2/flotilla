name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  # A newer push to a PR supersedes its run; main runs finish, since they
  # save the caches every PR restores.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tests tag, commit and revert in throwaway repositories, which needs
  # an identity; a developer's machine has one, a runner doesn't.
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@example.invalid

# The jobs run side by side, and the daemon's tests, most of the time, are
# split across runners. rust-cache keys each job's cache on the job, and only
# main saves: every PR restores main's, and PR-scoped copies would only crowd
# it out of the repo's cache quota. A failed test or lint must not throw away
# the compiled dependencies, so a failed main run saves too.
jobs:
  lint:
    name: daemon (fmt, clippy)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ (github.ref == 'refs/heads/main' || github.head_ref == 'ci/windows-faster') }}
          cache-on-failure: true
      - name: Lint daemon
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: daemon tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: windows-2022
    strategy:
      # One shard's failure must not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The shards build the same thing; one saving is enough.
          save-if: ${{ (github.ref == 'refs/heads/main' || github.head_ref == 'ci/windows-faster') && matrix.shard == 1 }}
          cache-on-failure: true
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.146
      # Every shard builds every test target, as `cargo test --all-targets`
      # does, and runs a round-robin share of each target's tests.
      - name: Test daemon
        run: cargo nextest run --locked --workspace --all-targets --no-fail-fast --partition count:${{ matrix.shard }}/${{ strategy.job-total }}

  shell:
    name: native shell
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ (github.ref == 'refs/heads/main' || github.head_ref == 'ci/windows-faster') }}
          cache-on-failure: true
          workspaces: apps/desktop/src-tauri -> target
      # tauri-build only needs the sidecar to exist; the shell's tests never
      # run it, so an empty file stands in for a daemon this job doesn't build.
      - name: Stage placeholder daemon sidecar
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force -Path apps/desktop/src-tauri/binaries/flotillad-x86_64-pc-windows-msvc.exe | Out-Null
      - name: Check native shell
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
