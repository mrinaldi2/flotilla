name: release

# Builds a production release: the macOS DMG, the Windows installer and a
# macOS flotillad tarball (binary + config + launchd agent + installer).
# Pushing a `v*` tag publishes a GitHub release; a manual dispatch only
# uploads the artifacts to the run, for dry runs. Builds start without a Rust
# cache: releases are rare, and keeping one warm would cost main-branch minutes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      updater: ${{ steps.updater.outputs.enabled }}
      release-config: ${{ steps.updater.outputs.config }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          cargo_version() { sed -n 's/^version = "\(.*\)"$/\1/p' "$1" | head -1; }
          conf="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$conf"
          fi
          # Every manifest carrying the release version. The desktop crate is
          # outside the root workspace, so it cannot inherit the version and
          # silently drifts unless it is checked here.
          for pair in \
            "apps/desktop/src-tauri/tauri.conf.json=$conf" \
            "Cargo.toml=$(cargo_version Cargo.toml)" \
            "apps/desktop/src-tauri/Cargo.toml=$(cargo_version apps/desktop/src-tauri/Cargo.toml)" \
            "apps/desktop/package.json=$(jq -r .version apps/desktop/package.json)"; do
            if [[ "$version" != "${pair#*=}" ]]; then
              echo "Version $version does not match ${pair%%=*} (${pair#*=})." >&2
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Source builds do not subscribe to any distributor's update channel.
      # Signing and an explicit public key enable updater artifacts for releases.
      - name: Configure updater
        id: updater
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$UPDATER_PUBLIC_KEY" ]]; then
            echo "Set UPDATER_PUBLIC_KEY when configuring updater signing." >&2
            exit 1
          fi
          endpoint="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          config="$(jq -cn --arg key "$UPDATER_PUBLIC_KEY" --arg endpoint "$endpoint" \
            '{plugins: {updater: {pubkey: $key, endpoints: [$endpoint]}}, bundle: {createUpdaterArtifacts: true}}')"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (aarch64)
    needs: prepare
    runs-on: macos-15
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      UPDATER_ENABLED: ${{ needs.prepare.outputs.updater }}
      FLOTILLA_RELEASE_CONFIG: ${{ needs.prepare.outputs.release-config }}
      # Compiled into flotillad, which recognises the owner's signed app by it
      # (H-110). Not a secret. HERMES_TEAM_ID is the variable's name from
      # before the rename, still read; the APPLE_TEAM_ID secret is the last
      # fallback.
      FLOTILLA_TEAM_ID: ${{ vars.FLOTILLA_TEAM_ID || vars.HERMES_TEAM_ID || secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      # A release with the placeholder Team ID never recognises the signed
      # app, so it doesn't build (ARCH-R38). flotillad also holds phase 2 at
      # runtime while it carries the placeholder.
      - name: Check the Team ID
        run: |
          if [[ ! "$FLOTILLA_TEAM_ID" =~ ^[A-Z0-9]{10}$ || "$FLOTILLA_TEAM_ID" == 0000000000 ]]; then
            echo "Set the FLOTILLA_TEAM_ID variable (or HERMES_TEAM_ID, or the APPLE_TEAM_ID secret) to the owner's 10-character Apple Team ID." >&2
            exit 1
          fi
          if [[ -n "${FLOTILLA_DEV_BUILD:-}" || -n "${HERMES_DEV_BUILD:-}" ]]; then
            echo "FLOTILLA_DEV_BUILD (or HERMES_DEV_BUILD) must not be set for a release." >&2
            exit 1
          fi

      - name: Build flotillad
        run: |
          pnpm notices:check --check-toolchain
          cargo build --locked --release -p flotillad

      - name: Package flotillad
        run: |
          stage="stage/flotillad-$VERSION"
          mkdir -p dist "$stage"
          cp target/release/flotillad "$stage/flotillad"
          cp LICENSE "$stage/"
          cp third-party/DAEMON_NOTICES.txt "$stage/THIRD_PARTY_NOTICES.txt"
          cp ops/flotillad.example.toml "$stage/"
          cp scripts/install-flotillad.sh "$stage/"
          chmod +x "$stage/install-flotillad.sh"
          tar -czf "dist/flotillad-$VERSION-aarch64-apple-darwin.tar.gz" -C stage "flotillad-$VERSION"

      # The desktop bundle ships the daemon as a signed sidecar; the app's
      # first-run wizard installs it as a launchd user agent.
      - name: Stage flotillad sidecar
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/flotillad "apps/desktop/src-tauri/binaries/flotillad-$triple"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # With the APPLE_* secrets configured, Tauri signs with the Developer ID
      # certificate and notarizes the app, so end users get no Gatekeeper
      # prompts. Without them the build falls back to an ad-hoc signature and
      # the release notes include the quarantine workaround.
      - name: Enable signing and notarization
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "No APPLE_CERTIFICATE secret — building an ad-hoc signed, unnotarized app."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            {
              echo "$var<<GHA_EOF"
              printf '%s\n' "${!var}"
              echo "GHA_EOF"
            } >> "$GITHUB_ENV"
          done
          echo "SIGNED=true" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build desktop app
        working-directory: apps/desktop
        env:
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://eu.i.posthog.com' }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_RELEASE_VERSION: ${{ env.VERSION }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_APP_VERSION: ${{ env.VERSION }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://eu.i.posthog.com' }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: |
          if [[ "$UPDATER_ENABLED" == "true" ]]; then
            pnpm tauri build --config "$FLOTILLA_RELEASE_CONFIG"
          else
            pnpm tauri build
          fi

      - name: Collect DMG and updater artifact
        run: |
          bundle=apps/desktop/src-tauri/target/release/bundle
          mv "$bundle"/dmg/*.dmg "dist/flotilla-desktop-$VERSION-aarch64.dmg"
          if [[ "$UPDATER_ENABLED" == "true" ]]; then
            mv "$bundle"/macos/*.app.tar.gz "dist/flotilla-desktop-$VERSION-aarch64.app.tar.gz"
            mv "$bundle"/macos/*.app.tar.gz.sig "dist/flotilla-desktop-$VERSION-aarch64.app.tar.gz.sig"
          fi

      # Tauri notarizes and staples the .app; notarize the DMG container too
      # so the download itself passes Gatekeeper's primary-signature check.
      - name: Notarize DMG
        if: env.SIGNED == 'true'
        run: |
          dmg="dist/flotilla-desktop-$VERSION-aarch64.dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"

      - name: Verify packaged notices
        run: |
          python3 scripts/check-packaged-notices.py \
            --app "apps/desktop/src-tauri/target/release/bundle/macos/Flotilla.app" \
            --daemon "dist/flotillad-$VERSION-aarch64-apple-darwin.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (x64)
    needs: prepare
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      UPDATER_ENABLED: ${{ needs.prepare.outputs.updater }}
      FLOTILLA_RELEASE_CONFIG: ${{ needs.prepare.outputs.release-config }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Stage flotillad sidecar
        run: ./scripts/prepare-sidecar.ps1

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Sourcemaps upload from the macOS job only; both builds ship the same
      # frontend under one release version.
      - name: Build desktop app
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_APP_VERSION: ${{ env.VERSION }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://eu.i.posthog.com' }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: |
          if [[ "$UPDATER_ENABLED" == "true" ]]; then
            pnpm tauri build --bundles nsis --config "$FLOTILLA_RELEASE_CONFIG"
          else
            pnpm tauri build --bundles nsis
          fi

      - name: Check installer lifecycle
        run: ./scripts/test-windows-installer.ps1 -Installer (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe).FullName

      - name: Collect installer and updater signature
        shell: bash
        run: |
          nsis=apps/desktop/src-tauri/target/release/bundle/nsis
          mkdir -p dist
          mv "$nsis"/*-setup.exe "dist/flotilla-desktop-$VERSION-x64-setup.exe"
          if [[ "$UPDATER_ENABLED" == "true" ]]; then
            mv "$nsis"/*-setup.exe.sig "dist/flotilla-desktop-$VERSION-x64-setup.exe.sig"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, macos, windows]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SIGNED: ${{ needs.macos.outputs.signed }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Write updater manifest
        if: needs.prepare.outputs.updater == 'true'
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          mac="flotilla-desktop-$VERSION-aarch64.app.tar.gz"
          win="flotilla-desktop-$VERSION-x64-setup.exe"
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_signature "$(cat "dist/$mac.sig")" \
            --arg mac_url "$base/$mac" \
            --arg win_signature "$(cat "dist/$win.sig")" \
            --arg win_url "$base/$win" \
            '{version: $version, pub_date: $pub_date, platforms: {
              "darwin-aarch64": {signature: $mac_signature, url: $mac_url},
              "windows-x86_64": {signature: $win_signature, url: $win_url}}}' \
            > dist/latest.json

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.updater == 'true'
        with:
          name: release-manifest
          path: dist/latest.json
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job has no checkout, so gh can't infer the repository.
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          ### Desktop app (this is all most people need)

          On a Mac, download the DMG attached to this release,
          open it and drag **Flotilla** to Applications. On Windows, run the
          `x64-setup.exe` installer; it installs for the current user only.
          The app bundles the daemon: on first launch a setup wizard offers to
          run bots on this machine (installs the bundled daemon as a background
          service — no terminal, no admin rights) or to attach to a remote
          daemon with a device token. Builds configured with updater signing offer app updates
          and can update the local daemon to match.

          Flotilla keeps its state under `~/.flotilla` and serves on port
          `49777`. A daemon already answering there stops the install: it
          refuses to start rather than run a second one against the same state.

          ### Daemon only (headless Mac mini / server)

          ```sh
          # Download the flotillad tarball attached to this release first.
          tar -xzf flotillad-VERSION-aarch64-apple-darwin.tar.gz
          flotillad-VERSION/flotillad service install
          ```

          Installs `flotillad` under `~/.flotilla/bin`, writes a default
          config to `~/.flotilla/flotillad.toml` (kept if it already exists), and
          starts the launchd user agent `com.manuelrinaldi.flotillad`. No sudo needed.

          ### Upgrading from The Hermes (`~/.thehermes`)

          The Hermes is now Flotilla. The first install of this release stops
          the old service (`com.manuelrinaldi.thehermesd` on macOS, the
          `The Hermes` task on Windows, and any Gravity one left over), moves
          `~/.thehermes` to `~/.flotilla` and starts the new one. Every bot
          restarts once and keeps its board, history and memory. `~/.thehermes`
          stays as a link to the new home for one release. Preview it with
          `flotillad migrate-home --dry-run`; undo it with
          `flotillad service uninstall && flotillad migrate-home --rollback`.
          A machine still on `~/.gravity` moves straight to `~/.flotilla`.

          Flotilla is a new app to macOS (`com.manuelrinaldi.flotilla`): it
          installs as `/Applications/Flotilla.app` beside The Hermes, takes
          over its preferences, and tells you when you can move The Hermes to
          the Trash. macOS asks again for the **microphone**, **speech
          recognition** and **accessibility (global shortcut)** permissions:
          grant them in System Settings → Privacy & Security when prompted,
          and remove the old "The Hermes" entries there. On Windows the
          installer replaces The Hermes in Program Files.

          The iPhone app is a new app too: install Flotilla on the phone and
          pair it again (Settings → Devices in the desktop app), then revoke
          the old The Hermes device.
          EOF
          if [[ "$SIGNED" != "true" ]]; then
            cat >> notes.md <<'EOF'

          > **Note:** this build is not notarized. Gatekeeper will block the
          > first launch on another machine — clear the quarantine flag once:
          > `xattr -cr "/Applications/Flotilla.app"`
          EOF
          fi
          cat >> notes.md <<'EOF'

          > **Note:** the Windows installer is not code-signed. SmartScreen
          > warns on first run — choose **More info**, then **Run anyway**.
          EOF
          sed -i "s/VERSION/$VERSION/g" notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Flotilla $VERSION" \
            --notes-file notes.md \
            --generate-notes --draft
          # Expose latest.json only after every release asset has uploaded.
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
