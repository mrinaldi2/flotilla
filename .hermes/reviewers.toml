# .hermes/reviewers.toml — mrinaldi2/gravity (H-279 draft, Architect 2026-10-10)
#
# Read from the PR's BASE, never its head (H-267). A change's required roles
# are the union of every area its paths match. A change no area matches needs
# `architect` (built-in fallback). The policy files themselves
# (`.hermes/*.toml`) always need architect + ce + owner: that area is
# hard-coded in the daemon and can't be removed or weakened here.
# The owner's own review is governed by the owner review setting
# (all | areas | flagged | none), not by this file; `security` below is the
# area name the `areas` setting keys on.
#
# Roles: architect (reviewer.arch), ux (reviewer.ux), ce (reviewer.ce,
# owner-assigned only), devops, qa (tester), owner.

# --- Security: trust boundaries, identity, owner-only gates -----------------
[[area]]
name = "security"
roles = ["architect", "ce"]
paths = [
  # Bot identity, permissions guard, secrets
  "crates/hermesd/src/bus_auth.rs",
  "crates/hermesd/src/bus_auth/**",
  "crates/hermesd/src/bot_permissions.rs",
  "crates/hermesd/src/bot_permissions/**",
  "crates/hermesd/src/secrets.rs",
  "crates/hermesd/src/secrets/**",
  "crates/hermesd/src/paths.rs",
  "crates/hermesd/src/paths/**",
  "crates/hermesd/src/contain.rs",
  "crates/hermesd/src/botmgmt.rs",
  "crates/hermesd/src/botmgmt/**",
  "crates/hermesd/src/mcp/selfmgmt.rs",
  "crates/hermesd/src/permissions.rs",
  "crates/hermesd/src/db/permissions.rs",
  "crates/hermesd/src/redact/**",
  # Bot identity on the bus (per-connection bot token) and its tools
  "crates/hermesd/src/mcp.rs",
  "crates/hermesd/src/mcp/tools.rs",
  # Owner credentials (devices behind owner_proof)
  "crates/hermesd/src/db/devices.rs",
  # The daemon's config (origin allowlist) and its bind (/health)
  "crates/hermesd/src/config.rs",
  "crates/hermesd/src/config/**",
  "crates/hermesd/src/server.rs",
  # Owner proof on every WS path, approvals, grants, Run cards
  "crates/hermesd/src/ws.rs",
  "crates/hermesd/src/ws/**",
  "crates/hermesd/src/approval.rs",
  "crates/hermesd/src/approval/**",
  "crates/hermesd/src/owner_action.rs",
  "crates/hermesd/src/owner_action/**",
  "crates/hermesd/src/mcp/owner_actions.rs",
  "crates/hermesd/src/db/owner_actions.rs",
  # Owner provenance in chat (FROM_OWNER, H-306)
  "crates/hermesd/src/owner_threads.rs",
  "crates/hermesd/src/owner_threads/**",
  "crates/hermesd/src/db/owner_threads.rs",
  # Owner rulings
  "crates/hermesd/src/decisions.rs",
  "crates/hermesd/src/decisions/**",
  "crates/hermesd/src/db/decisions*.rs",
  "crates/hermesd/src/mcp/decisions.rs",
  # Owner-typed provenance (H-195/H-209)
  "crates/hermesd/src/supervisor/hooks.rs",
  "crates/hermesd/src/supervisor/session_hooks.rs",
  "crates/hermesd/src/supervisor/composer*.rs",
  "crates/hermesd/src/supervisor/typing.rs",
  # Composer off when the hook settings write fails (H-209 M1)
  "crates/hermesd/src/supervisor/lifecycle.rs",
  # Roles (who may review and merge) and board gates
  "crates/hermesd/src/board/team.rs",
  "crates/hermesd/src/mcp/board_roles.rs",
  "crates/hermesd/src/board/guards.rs",
  "crates/hermesd/src/board/guards/**",
  "crates/hermesd/src/db/reviews.rs",
  # Peer trust (links, forwarded owner acts, mirrors)
  "crates/hermesd/src/peer.rs",
  "crates/hermesd/src/peer/**",
  "crates/hermesd/src/db/peers.rs",
  "crates/hermesd/src/db/peer_grants.rs",
  # PR gates: reviews, separation of duties, owner review, merge, checks
  "crates/hermesd/src/mcp/prs.rs",
  "crates/hermesd/src/prs/checks.rs",
  "crates/hermesd/src/db/checks.rs",
  "crates/hermesd/src/db/prs.rs",
  "crates/hermesd/src/db/review_settings.rs",
  "crates/hermesd/src/db/merge_queue.rs",
  "crates/hermesd/src/machine_tools.rs",
  "crates/hermesd/src/prs/owner*.rs",
  "crates/hermesd/src/prs/review*.rs",
  "crates/hermesd/src/prs/merge*.rs",
  "crates/hermesd/src/prs/mergeable*.rs",
  "crates/hermesd/src/prs/queue*.rs",
  "crates/hermesd/src/prs/flow*.rs",
  "crates/hermesd/src/prs/worktree*.rs",
  "crates/hermesd/src/prs/check_*.rs",
  "crates/hermesd/src/prs/policy.rs",
  "crates/hermesd/src/prs/policy/**",
  "crates/hermesd/src/check_exec.rs",
  "crates/hermesd/src/check_tree*.rs",
  "crates/hermesd/src/pr_cli.rs",
  # Git run on bot-controlled repos; deleting trees
  "crates/hermesd/src/safe_git*.rs",
  "crates/hermesd/src/cleanup.rs",
  "crates/hermesd/src/cleanup/**",
  # Release gates: rulings, freeze, install, serve, tag, Leave out
  "crates/hermesd/src/releases/rule.rs",
  "crates/hermesd/src/releases/gates.rs",
  "crates/hermesd/src/releases/package.rs",
  "crates/hermesd/src/releases/land*.rs",
  "crates/hermesd/src/releases/tag*.rs",
  "crates/hermesd/src/releases/leave_out*.rs",
  "crates/hermesd/src/releases/quiesce_gate.rs",
  "crates/hermesd/src/releases/install*.rs",
  "crates/hermesd/src/releases/install/**",
  "crates/hermesd/src/releases/publish.rs",
  "crates/hermesd/src/releases/serve*.rs",
  "crates/hermesd/src/releases/confine*.rs",
  "crates/hermesd/src/releases/build_installer*.rs",
  "crates/hermesd/src/releases/deploy*.rs",
  "crates/hermesd/src/releases/assemble.rs",
  "crates/hermesd/src/releases/phone.rs",
  "crates/hermesd/src/releases/sha_cache.rs",
  # Service install / home migration (runs with the owner's rights)
  "crates/hermesd/src/service.rs",
  "crates/hermesd/src/service/**",
  "crates/hermesd/src/migrate_home.rs",
  "crates/hermesd/src/migrate_home/**",
  # The app's code identity, signing, the release pipeline
  "apps/desktop/src-tauri/**",
  "ops/**",
  ".github/workflows/**",
  "scripts/prepare-sidecar*",
  "scripts/install-hermesd.sh",
]

# --- Daemon and shared crates ------------------------------------------------
[[area]]
name = "daemon"
roles = ["architect"]
paths = ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain*"]

# --- The wire contract (protobuf): breaking-change and client impact ---------
[[area]]
name = "contract"
roles = ["architect"]
paths = ["proto/**", "buf.yaml", "buf.gen.yaml", "docs/protocol.md"]

# --- Desktop app UI ----------------------------------------------------------
[[area]]
name = "desktop"
roles = ["ux"]
paths = ["apps/desktop/**"]

# --- Marketing site -----------------------------------------------------------
[[area]]
name = "marketing"
roles = ["ux"]
paths = ["apps/marketing/**"]

# --- Docs (MkDocs site, ADRs, design notes in the repo) -------------------
[[area]]
name = "docs"
roles = ["architect"]
paths = ["docs/**", "mkdocs.yml", "*.md"]

# --- Build / verify scripts ----------------------------------------------------
[[area]]
name = "tooling"
roles = ["architect", "devops"]
paths = ["scripts/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
